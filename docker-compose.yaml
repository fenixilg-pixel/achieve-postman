services:

    php-fpm:
        build: docker
        container_name: 'php-b'
        ports:
            - '9100:9000'
        volumes:
            - ./:/app
            - ./docker/my-php.ini:/usr/local/etc/php/php.ini
        working_dir: /app

    nginx:
        image: nginx
        container_name: 'nginx-b'
        working_dir: /app
        ports:
            - '8777:80'
        volumes:
            - ./:/app
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf

